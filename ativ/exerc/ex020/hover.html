<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-indent: 20px;
        }

        
        div > p {
            display: none;
        }

        div:hover > p {
            display: block;
        }

        div:hover {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo:</p>
    <div>
        Passe o mouse aqui
        <p>Texto escondido!</p>
    </div>
    <p>Fim do exemplo</p>
    <p>Este é um parágrafo de exemplo para demonstrar o text-indent aplicado aos parágrafos.</p>
</body>
</html>
