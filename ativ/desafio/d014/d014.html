<!DOCTYPE html>

<head>

    <title>Desafio 14</title>

        td {
            border: 1px solid black;
            padding: 3px 20px;
            text-align: center;

            font-weight: bold;
            color: white;
        }

<body>

        <thead class="cabecalho">
            <tr>
                <td rowspan="2">Área</td>
                <td rowspan="2">Disciplinas</td>

                <td rowspan="2">Média</td>
            </tr>
            <tr>
                <td>Nota 1</td>
                <td>Nota 2</td>
            </tr>
        </thead>
    </table>
